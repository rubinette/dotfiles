# This tmux statusbar config was created by tmuxline.vim
# on Mon, 08 Feb 2021

set -g status-justify "left"
set -g status "on"
set -g status-left-style "none"
set -g message-command-style "fg=#d8dee9,bg=#434c5e"
set -g status-right-style "none"
set -g pane-active-border-style "fg=#88c0d0"
set -g status-position "top"
set -g status-style "none,bg=#3b4252"
set -g message-style "fg=#d8dee9,bg=#434c5e"
set -g pane-border-style "fg=#4c566a"
set -g status-right-length "100"
set -g status-left-length "100"
setw -g window-status-activity-style "underscore,fg=#d8dee9,bg=#3b4252"
setw -g window-status-separator ""
setw -g window-status-style "none,fg=#d8dee9,bg=#3b4252"
set -g status-left "#[fg=#2e3440,bg=#88c0d0] #S #[fg=#88c0d0,bg=#3b4252,nobold,nounderscore,noitalics]"
set -g status-right "#[fg=#3b4252,bg=#3b4252,nobold,nounderscore,noitalics]#[fg=#d8dee9,bg=#3b4252] %a #[fg=#434c5e,bg=#3b4252,nobold,nounderscore,noitalics]#[fg=#d8dee9,bg=#434c5e] %Y-%m-%d %H:%M #[fg=#88c0d0,bg=#434c5e,nobold,nounderscore,noitalics]#[fg=#2e3440,bg=#88c0d0]  #h "
setw -g window-status-format "#[fg=#3b4252,bg=#3b4252,nobold,nounderscore,noitalics]#[default] #I #W #[fg=#3b4252,bg=#3b4252,nobold,nounderscore,noitalics]"
setw -g window-status-current-format "#[fg=#3b4252,bg=#88c0d0,nobold,nounderscore,noitalics]#[fg=#2e3440,bg=#88c0d0,bold] #I #W #[fg=#88c0d0,bg=#3b4252,nobold,nounderscore,noitalics]"
