# This tmux statusbar config was created by tmuxline.vim
# on Mon, 08 Feb 2021 with the `:TmuxlineSnapshot` Command.

set -g status-justify "left"
set -g status "on"
set -g status-left-style "none"
set -g message-command-style "fg=#414858,bg=#d8dee9"
set -g status-right-style "none"
set -g pane-active-border-style "fg=#5e81ac"
set -g status-position "top"
set -g status-style "none,bg=#d8dee9"
set -g message-style "fg=#414858,bg=#d8dee9"
set -g pane-border-style "fg=#a5abb6"
set -g status-right-length "100"
set -g status-left-length "100"
setw -g window-status-activity-style "underscore,fg=#414858,bg=#d8dee9"
setw -g window-status-separator ""
setw -g window-status-style "none,fg=#414858,bg=#d8dee9"
set -g status-left "#[fg=#eceff4,bg=#5e81ac] #S #[fg=#5e81ac,bg=#d8dee9,nobold,nounderscore,noitalics]"
set -g status-right "#[fg=#d8dee9,bg=#d8dee9,nobold,nounderscore,noitalics]#[fg=#414858,bg=#d8dee9] %a #[fg=#eceff4,bg=#d8dee9,nobold,nounderscore,noitalics]#[fg=#414858,bg=#eceff4] %Y-%m-%d %H:%M #[fg=#5e81ac,bg=#eceff4,nobold,nounderscore,noitalics]#[fg=#eceff4,bg=#5e81ac]  #h "
setw -g window-status-format "#[fg=#d8dee9,bg=#d8dee9,nobold,nounderscore,noitalics]#[default] #I #W #[fg=#d8dee9,bg=#d8dee9,nobold,nounderscore,noitalics]"
setw -g window-status-current-format "#[fg=#d8dee9,bg=#5e81ac,nobold,nounderscore,noitalics]#[fg=#eceff4,bg=#5e81ac,bold] #I #W #[fg=#5e81ac,bg=#d8dee9,nobold,nounderscore,noitalics]"
